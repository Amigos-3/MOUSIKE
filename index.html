<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Amigos | Moesik</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sidebar-overlay"></div>
  <nav class="sidebar">
    <button class="sidebar-close">&times;</button>
    <a href="index.html" class="active">BERANDA</a>
    <a href="favorite.html">FAVORITE</a>
  </nav>

  <header class="site-header">
    <button class="menu-btn" aria-label="Buka menu">
      <span></span><span></span><span></span>
    </button>
    <h1 class="site-title">THREE AMIGOS</h1>
    <a class="logo-link" href="profiles.html" title="Lihat profile developer">
      <img src="logo.jpg" alt="Logo Moesik">
    </a>
  </header>

  <div class="search-wrap">
    <div class="search-bar">
      <span class="icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="Cari Moesik Loe">
    </div>
  </div>

  <main class="song-grid" id="songGrid"></main>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    const grid = document.getElementById("songGrid");
    const searchInput = document.getElementById("searchInput");

    // 4 lagu acak setiap kali halaman dibuka
    let randomSet = pickRandomN(SONGS, 4);
    renderSongGrid(grid, randomSet);

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        renderSongGrid(grid, randomSet);
        return;
      }
      const results = SONGS.filter((s) => s.title.toLowerCase().includes(q));
      renderSongGrid(grid, results, { emptyText: "Lagu tidak ditemukan." });
    });
  </script>
</body>
</html>
